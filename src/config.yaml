site:
  name: SertifVault
  site: 'https://kayzenn123.github.io/agent-tools-sertifvault'
  base: '/'
  trailingSlash: false

# Default SEO metadata
metadata:
  title:
    default: SertifVault — Kamus Prestasi
    template: '%s — SertifVault'
  description: "Brankas sertifikat pribadimu: arsipkan piagam lomba, beasiswa, dan kursus sebagai entri kamus, jelajahi di peta 8-bit, ekspor sekali klik."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: SertifVault
    images:
      - url: '~/assets/images/og-image.svg'
        width: 1200
        height: 630
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: id
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
